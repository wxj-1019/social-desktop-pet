<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="星屿 StarIsle · 跨平台 AI 社交桌宠">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2447"/>
      <stop offset="1" stop-color="#0c0f22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffd97e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe094" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe094" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="300" rx="24" fill="url(#bg)"/>

  <!-- 背景星尘（静止成立；SMIL 为渐进增强） -->
  <circle cx="92" cy="62" r="2" fill="#cbdaf5" opacity="0.7"/>
  <circle cx="640" cy="48" r="1.8" fill="#ffffff">
    <animate attributeName="opacity" values="0.12;0.75;0.12" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="822" cy="92" r="2.2" fill="#cbdaf5" opacity="0.5"/>
  <circle cx="540" cy="72" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="890" cy="212" r="1.6" fill="#cbdaf5" opacity="0.4"/>
  <circle cx="64" cy="232" r="1.6" fill="#ffffff" opacity="0.35"/>
  <circle cx="724" cy="240" r="2" fill="#f2aabd" opacity="0.5"/>
  <circle cx="472" cy="40" r="1.6" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 彗尾：星屿跃迁的轨迹 -->
  <path d="M322,118 Q236,158 128,192" fill="none" stroke="#ffe094" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="116" cy="188" r="10" fill="url(#gold)" opacity="0.12"/>
  <circle cx="152" cy="172" r="8" fill="url(#gold)" opacity="0.18"/>
  <circle cx="186" cy="156" r="7" fill="url(#gold)" opacity="0.26"/>
  <circle cx="216" cy="142" r="6" fill="url(#gold)" opacity="0.36"/>
  <circle cx="242" cy="132" r="5" fill="url(#gold)" opacity="0.5"/>
  <circle cx="264" cy="126" r="4" fill="url(#gold)" opacity="0.7"/>

  <!-- 主星：尾端星 -->
  <circle cx="322" cy="112" r="58" fill="url(#glow)">
    <animate attributeName="r" values="52;64;52" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(322 112)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3.6s" repeatCount="indefinite"/>
      <path d="M0 -36 Q6 -6 36 0 Q6 6 0 36 Q-6 6 -36 0 Q-6 -6 0 -36 Z" fill="url(#gold)"/>
    </g>
  </g>

  <!-- 粉色小星星（腮红点缀） -->
  <path transform="translate(706 152) scale(0.32)" d="M0 -40 Q5 -5 40 0 Q5 5 0 40 Q-5 5 -40 0 Q-5 -5 0 -40 Z" fill="#f2aabd" opacity="0.85"/>

  <!-- 字标 -->
  <text x="424" y="152" font-size="94" font-weight="800" fill="url(#gold)">星屿</text>
  <text x="424" y="200" font-size="28" font-weight="600" fill="#cbdaf5" letter-spacing="8">StarIsle</text>
  <text x="424" y="244" font-size="20" fill="#8fa3d9" letter-spacing="1">跨平台 AI 社交桌宠 · 星际旅行 × 星光记忆</text>
</svg>
