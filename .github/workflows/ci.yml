name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # 根 references 含全部 packages + apps/server（D-13）；apps/desktop 需单独检查（审查发现 #1）
      - run: pnpm typecheck
      - run: pnpm --filter @pet/desktop typecheck
      # D-13 部署产物门禁：server build 必须真实产出 dist/（tsconfig.build.json，noEmit:false）
      - run: pnpm --filter @pet/server build
      - run: pnpm test

  # 补 2：Electron e2e 冒烟（Linux 需 xvfb + Electron 系统依赖）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 在 Ubuntu 的运行时依赖
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2
      - run: pnpm --filter @pet/desktop build
      - run: xvfb-run -a npx playwright test --config e2e/playwright.config.ts

  # Task 13：Windows 真机目标平台验证星屿（SVG 桌宠，不依赖后端，无 xvfb 问题）
  star-isle-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pet/desktop typecheck
      - run: pnpm --filter @pet/desktop build
      - run: pnpm exec playwright test --config e2e/playwright.config.ts star-isle.spec.ts
