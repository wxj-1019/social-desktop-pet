# electron-builder 配置 —— 13.1 Windows 发行（默认按用户安装，不要求管理员权限）
appId: com.pet.desktop
productName: AI Pet
copyright: Copyright © 2026 AI Pet

directories:
  output: release
  buildResources: resources

# 只打包构建产物 + 模型资源（模型文件受 V-1 许可门禁，未就绪前不随包）
files:
  - out/**
  - package.json

# Task 10：托盘图标随包分发（TrayController.trayIconPath 指向 resources/tray.png）
extraResources:
  - from: resources/tray.png
    to: tray.png

win:
  # NSIS 默认 per-user 安装（13.1：不要求管理员权限）
  target:
    - target: nsis
      arch:
        - x64
  # 应用图标：占位星屿头像（pnpm assets:icon 生成；V-12 角色资产就绪后替换）
  icon: icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 中文名安装目录与开始菜单
  shortcutName: AI Pet
  uninstallDisplayName: AI Pet

# 压缩产物 hash（更新 manifest 校验用，13.1/8.3）
compression: maximum

publish:
  - provider: generic
    url: https://updates.example.com/pet
